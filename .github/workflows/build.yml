name: Build Flutter APK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./android_app_flutter 
        run: flutter pub get

      - name: The Bulletproof Android Fix
        working-directory: ./android_app_flutter
        run: |
          rm -rf android
          flutter create .
          # 1. Force minimum SDK to 23 for Firebase
          sed -i 's/minSdkVersion.*/minSdkVersion 23/g' android/app/build.gradle
          # 2. Force target SDK to 34 (Android 14) so modern phones allow the install
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' android/app/build.gradle
          # 3. Force compile SDK to 34 to match
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' android/app/build.gradle

      - name: Build APK
        working-directory: ./android_app_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgentOS-App-APK
          path: android_app_flutter/build/app/outputs/flutter-apk/app-release.apk
