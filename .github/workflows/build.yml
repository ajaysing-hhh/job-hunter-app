name: Build Flutter APK

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./android_app_flutter 
        run: flutter pub get

      - name: The Surgical Android Fix
        working-directory: ./android_app_flutter
        run: |
          rm -rf android
          flutter create .
          # Safely swaps the internal Flutter variables for modern Android integers
          sed -i 's/flutter\.minSdkVersion/23/g' android/app/build.gradle
          sed -i 's/flutter\.targetSdkVersion/34/g' android/app/build.gradle
          sed -i 's/flutter\.compileSdkVersion/34/g' android/app/build.gradle

      - name: Build APK
        working-directory: ./android_app_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgentOS-App-APK
          path: android_app_flutter/build/app/outputs/flutter-apk/app-release.apk
